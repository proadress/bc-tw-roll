name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check scripts
        run: |
          sh -n scripts/update-bc-tw.sh
          ruby -c scripts/build-lite-data.rb
          ruby -c scripts/validate-data.rb
      - name: Rebuild data
        run: ruby scripts/build-lite-data.rb
      - name: Validate data
        run: ruby scripts/validate-data.rb
      - name: Confirm reproducible output
        run: git diff --exit-code -- data/bc-tw-lite.json
